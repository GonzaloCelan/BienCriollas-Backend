spring:
  application:
    name: stock
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/biencriollas_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=utf8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jackson:
    time-zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

server:
  port: ${PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:bien-criollas-api}
    access-token-expiration: ${JWT_EXPIRATION:8h}
    bootstrap-admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      name: ${ADMIN_NAME:Administrador}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
