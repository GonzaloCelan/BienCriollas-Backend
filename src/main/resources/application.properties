spring.application.name=stock

server.port=${PORT:8080}

# =========================
# DATABASE - Railway + local fallback
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biencriollas_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:istea}

# =========================
# HIKARI
# =========================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# =========================
# TIMEZONE
# =========================
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# HIBERNATE DIALECT
# =========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect