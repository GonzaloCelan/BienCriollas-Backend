spring.application.name=stock

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biencriollas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:istea}
sping.jpa


